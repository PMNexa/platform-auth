[project]
name = "platform-auth-backend"
version = "0.1.0"
description = "platform-auth's Django app (login) - importable by a host app's INSTALLED_APPS, matching the frontend package-import rule."
license = { text = "PolyForm-Shield-1.0.0" }
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.1",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "uuid6>=2024.1.12",
]
# platform-core-backend (core_api: errors/exceptions/pagination/filters/
# uuid7 utils, BaseSerializer/BaseViewSet) is a real runtime dependency,
# not listed here - it isn't published anywhere pip can resolve a name
# to, so whoever installs this package must also `pip install -e` a
# checkout of apps/platform-core/backend (apps/main's docker-compose does
# this already; see AGENTS.md).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_auth*"]
